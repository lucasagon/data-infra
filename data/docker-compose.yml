services:
  metabase:
    image: metabase/metabase:latest
    cpus: 1.0
    mem_limit: 2g
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: pgbouncer
      MB_DB_PORT: 6432
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      MB_SITE_URL: ${MB_SITE_URL}
    volumes:
      - metabase_data:/metabase-data
    networks:
      - app_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`metabase.vivaceengenharia.com`)"
      - "traefik.http.routers.metabase.service=metabase"
      - "traefik.http.routers.metabase.entrypoints=websecure"
      - "traefik.http.routers.metabase.tls.certresolver=letsencrypt"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "5678:5678"
    environment:
      TZ: America/Sao_Paulo
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: pgbouncer
      DB_POSTGRESDB_PORT: 6432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASS}
      N8N_TRUST_PROXY: "true"
    volumes:
      - n8n_n8n_data:/home/node/.n8n
    networks:
      - app_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`automacoes.vivaceengenharia.com`)"
      - "traefik.http.routers.n8n.service=n8n"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  mage:
    image: mageai/mageai:latest
    cpus: 1.0
    mem_limit: 2g
    container_name: mage
    restart: unless-stopped
    command: mage start ${MAGE_PROJECT_NAME}
    env_file:
      - .env
    environment:
      USER_CODE_PATH: /home/src/${MAGE_PROJECT_NAME}
      ENV: ${MAGE_ENV}
    ports:
      - "${MAGE_PORT}:6789"
    volumes:
      - mage_data:/home/src/
    networks:
      - app_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mage.rule=Host(`mage.vivaceengenharia.com`)"
      - "traefik.http.routers.mage.service=mage"
      - "traefik.http.routers.mage.entrypoints=websecure"
      - "traefik.http.routers.mage.tls.certresolver=letsencrypt"
      - "traefik.http.services.mage.loadbalancer.server.port=6789"

  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  pgadmin-prod:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-prod
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8978:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - /opt/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - app_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.vivaceengenharia.com`)"
      - "traefik.http.routers.pgadmin.service=pgadmin"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"


volumes:
  metabase_data:
    external: true
  n8n_n8n_data:
    external: true
  pgadmin_data:
  mage_data:

networks:
  app_network:
    external: true
